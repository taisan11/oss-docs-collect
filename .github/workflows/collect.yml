name: collect

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Collect documentation
        run: bun run collect

      - name: Commit collected documentation
        run: |
          git config user.email "action@github.com"
          git config user.name "collect bot"
          git add docs state.json
          git commit -m "data: update collected docs" || echo "no changes"
          git push

      - name: Build Hugging Face dataset
        run: bun run dataset:build

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: taisan11/oss-docs-collect
        run: bun run dataset:upload
